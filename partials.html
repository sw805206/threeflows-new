<!--
  partials.html — single source for the shared header and footer.
  Fetched (relative path) and injected into #tf-header / #tf-footer on
  every page by the snippet at the bottom of each shell page. Edit the
  header/footer once here; every page updates. Not a standalone page.

  Hidden pages (surveys.html; privacy.html and subscribe.html except their
  footer links) must never be added to the nav. A footer link is NOT a nav
  entry: the nav below is the source of truth for what is publicly listed
  (SCOPE.md), and both pages stay unlisted and noindex regardless.
-->
<template id="tf-header-partial">
  <header class="tf-nav">
    <div class="tf-container tf-nav-inner">
      <a class="tf-lockup" href="index.html">
        <img src="assets/logo-mark.svg" alt="" class="tf-lockup-mark">
        <span class="tf-lockup-name">Three Flows Solutions</span>
      </a>

      <button type="button" class="tf-nav-toggle" aria-expanded="false"
              aria-controls="tf-nav-links" aria-label="Menu">
        <span class="tf-nav-toggle-bar"></span>
        <span class="tf-nav-toggle-bar"></span>
        <span class="tf-nav-toggle-bar"></span>
      </button>

      <nav class="tf-nav-links" id="tf-nav-links" aria-label="Primary">
        <a href="index.html">Home</a>

        <div class="tf-nav-item tf-has-dropdown">
          <button type="button" class="tf-nav-trigger" aria-expanded="false"
                  aria-haspopup="true">Services</button>
          <!-- Services: the four DETAIL pages, short labels per SCOPE.md's nav spec. -->
          <div class="tf-dropdown">
            <a href="business-planning.html">Plan</a>
            <a href="sourcing-support.html">Source</a>
            <a href="launch-hypercare.html">Launch</a>
            <a href="ongoing-management.html">Grow</a>
          </div>
        </div>

        <div class="tf-nav-item tf-has-dropdown">
          <button type="button" class="tf-nav-trigger" aria-expanded="false"
                  aria-haspopup="true">Resources</button>
          <!-- Order matches the home page's Knowledge Bank band. Seminars is
               absent here on purpose — seminars.html is an unbuilt shell, so it
               is not linked. When it ships it takes the slot BETWEEN Tools and
               Links, giving Blogs, Tools, Seminars, Links in both places; the
               order is settled, not to be re-derived. -->
          <div class="tf-dropdown">
            <a href="blogs.html">Blogs</a>
            <a href="tools.html">Tools</a>
            <a href="links.html">Links</a>
          </div>
        </div>

        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
</template>

<template id="tf-footer-partial">
  <footer class="tf-surface-ink tf-footer">
    <div class="tf-container tf-footer-inner">
      <!-- Left cluster: reversed logo mark + copyright. The wordmark span was
           removed here — the © line now sits beside the mark. The mark + © align
           via .tf-lockup's own flex/gap/center rule (no new CSS). The © keeps its
           <small> fine-print styling — NOT .tf-lockup-name, which is a 2-word
           wordmark treatment (20px heading, nowrap) and wrong for a long string.
           Year is hardcoded by decision: inject scripts don't run inside
           innerHTML and the injector isn't shared, so auto-year would cost every
           shell page. Paper text inherited from .tf-surface-ink. -->
      <div class="tf-lockup">
        <img src="assets/logo-mark-reversed.svg" alt="" class="tf-lockup-mark">
        <small>© 2026 Three Flows Solutions LLC. All rights reserved.</small>
      </div>
      <!-- Subscribe joins Privacy & Terms in the footer bar — one word, no
           sentence, no second row. The footer's spareness is the design; a CTA
           that doubled its height would be a different footer.

           NO NEW CSS, and nothing here is a new pattern. It is a second child of
           the existing .tf-footer-links flex nav, so it inherits that nav's 14px
           / 500 and its `gap: var(--tf-space-3)` — which IS the site's separator
           between footer links. No glyph is added: the gap is what the footer
           already uses, and a "·" or "|" would be inventing a device this
           footer does not have. The colour comes from
           `.tf-surface-ink.tf-footer a`, the footer-specific brick tint ratified
           at ~4.8:1 against this lighter ground.

           Subscribe sits FIRST because it is the action; the legal link
           conventionally closes a footer. -->
      <nav class="tf-footer-links" aria-label="Footer">
        <a href="subscribe.html">Subscribe</a>
        <a href="privacy.html">Privacy &amp; Terms</a>
      </nav>
    </div>
  </footer>
</template>
